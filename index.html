<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Bounce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== ARCADE TITLE SCREEN ========== -->
<div id="welcomeScreen" class="welcome-screen theme-day">
    <div class="title-world" aria-hidden="true">
        <div class="world-sun"></div>
        <div class="title-cloud cloud-a"></div><div class="title-cloud cloud-b"></div><div class="title-cloud cloud-c"></div>
        <div class="world-hill hill-back"></div><div class="world-hill hill-front"></div>
        <div class="title-ground"><span></span></div>
        <i class="float-coin coin-a">$</i><i class="float-coin coin-b">$</i>
    </div>
    <main class="arcade-menu">
        <div class="title-lockup">
            <div class="title-kicker">✦ READY TO PLAY! ✦</div>
            <h1 class="welcome-title"><span>BALLOON</span><span>BOUNCE</span></h1>
            <div class="title-ribbon">DON'T POP!</div>
        </div>
        <div class="hero-balloon" aria-hidden="true">
            <svg viewBox="0 0 100 150">
                <path class="hero-string" d="M50 91 C30 111 69 126 49 146" />
                <ellipse class="hero-body" cx="50" cy="48" rx="34" ry="43" />
                <path class="hero-knot" d="M41 84 L59 84 L50 98 Z" />
                <ellipse class="hero-shine" cx="38" cy="30" rx="5" ry="9" />
                <circle class="hero-eye" cx="40" cy="47" r="3" /><circle class="hero-eye" cx="60" cy="47" r="3" />
                <path class="hero-smile" d="M42 57 Q50 66 58 57" />
            </svg>
        </div>
        <section class="arcade-actions" aria-label="Start game">
            <label class="player-name" for="usernameInput"><span>PLAYER</span><input id="usernameInput" type="text" placeholder="GUEST" maxlength="20" autocomplete="off" spellcheck="false" aria-label="Player name (optional)"></label>
            <button id="playButton" class="btn-play" type="button"><span class="play-triangle">▶</span> PLAY</button>
        </section>
        <button id="leaderboardButton" class="leaderboard-trigger" type="button" aria-haspopup="dialog">🏆 LEADERBOARD</button>
        <section class="mini-settings" aria-label="Game appearance">
            <div class="mini-setting"><span class="mini-label">SKY</span><div class="welcome-opt-row theme-options" id="homeThemeRow">
                <button type="button" class="home-opt-btn ht-active" data-ht="day" aria-label="Day theme" title="Day"><span class="pause-swatch day-swatch"></span></button>
                <button type="button" class="home-opt-btn" data-ht="sunset" aria-label="Sunset theme" title="Sunset"><span class="pause-swatch sunset-swatch"></span></button>
                <button type="button" class="home-opt-btn" data-ht="night" aria-label="Night theme" title="Night"><span class="pause-swatch night-swatch"></span></button>
            </div></div>
            <div class="mini-setting"><span class="mini-label">BALLOON</span><div class="welcome-opt-row color-options" id="homeColorRow">
                <button type="button" class="home-opt-btn hc-active" data-hc="pink" style="--sw:#FF75AD" aria-label="Pink balloon" title="Pink"><span class="pause-color-dot" style="background:#FF75AD"></span></button>
                <button type="button" class="home-opt-btn" data-hc="lavender" style="--sw:#C4A1FF" aria-label="Lavender balloon" title="Lavender"><span class="pause-color-dot" style="background:#C4A1FF"></span></button>
                <button type="button" class="home-opt-btn" data-hc="mint" style="--sw:#6DEABF" aria-label="Mint balloon" title="Mint"><span class="pause-color-dot" style="background:#6DEABF"></span></button>
                <button type="button" class="home-opt-btn" data-hc="coral" style="--sw:#FF7F6B" aria-label="Coral balloon" title="Coral"><span class="pause-color-dot" style="background:#FF7F6B"></span></button>
            </div></div>
        </section>
        <footer class="game-instructions"><span>HOLD TO INFLATE</span><b>·</b><span>AVOID PIPES &amp; BIRDS</span><b>·</b><span>COLLECT COINS</span></footer>
    </main>
    <section id="leaderboardModal" class="leaderboard-modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle" aria-describedby="leaderboardStatus" hidden>
        <div class="leaderboard-card">
            <div class="leaderboard-eyebrow">✦ ARCADE HALL OF FAME ✦</div>
            <h2 id="leaderboardTitle">TOP FLIGHTS</h2>
            <p class="leaderboard-subtitle">The bravest balloon pilots</p>
            <div class="leaderboard-table-wrap">
                <table class="leaderboard-table">
                    <thead><tr><th scope="col">RANK</th><th scope="col">PLAYER</th><th scope="col">DISTANCE</th><th scope="col">COINS</th></tr></thead>
                    <tbody id="leaderboardRows"></tbody>
                </table>
                <p id="leaderboardStatus" class="leaderboard-status" role="status" aria-live="polite">Loading scores…</p>
            </div>
            <button id="closeLeaderboardButton" class="leaderboard-close" type="button">← BACK TO MENU</button>
        </div>
    </section>
</div>

<!-- ========== GAME SCREEN ========== -->
<div id="gameScreen" class="game-screen-wrapper" style="display:none;">

    <canvas id="gameCanvas"></canvas>

    <!-- Player name badge (top-center) -->
    <div id="playerBadge" class="player-badge"></div>

    <!-- Pause button (below badge, top-center) -->
    <button id="pauseBtn" class="pause-btn" aria-label="Pause game">⏸</button>

    <!-- Inflate button -->
    <button id="inflateButton">HOLD TO INFLATE 🎈</button>

    <!-- Game-over buttons row -->
    <div id="gameOverBtns" class="game-over-btn-row" style="display:none;">
        <button id="homeButton"  class="btn-home">🏠 Home</button>
        <button id="replayButton" class="btn-replay">PLAY AGAIN 🔄</button>
    </div>

    <!-- ===== PAUSE MODAL ===== -->
    <div id="pauseModal" class="pause-modal" style="display:none;" aria-modal="true" role="dialog" aria-label="Game paused">
        <div class="pause-card">

            <div class="pause-title">⏸ Paused</div>

            <!-- Theme section -->
            <div class="pause-section-label">🎨 Background Theme</div>
            <div class="pause-row" id="pauseThemeRow">
                <button class="pause-opt-btn pt-active" data-pt="day">
                    <span class="pause-swatch day-swatch"></span> Day ☀️
                </button>
                <button class="pause-opt-btn" data-pt="sunset">
                    <span class="pause-swatch sunset-swatch"></span> Sunset 🌅
                </button>
                <button class="pause-opt-btn" data-pt="night">
                    <span class="pause-swatch night-swatch"></span> Night 🌙
                </button>
            </div>

            <!-- Balloon colour section -->
            <div class="pause-section-label">🎈 Balloon Colour</div>
            <div class="pause-row" id="pauseColorRow">
                <button class="pause-opt-btn pc-active" data-pc="pink"     style="--sw:#FF75AD;">
                    <span class="pause-color-dot" style="background:#FF75AD;"></span> Pink
                </button>
                <button class="pause-opt-btn" data-pc="lavender" style="--sw:#C4A1FF;">
                    <span class="pause-color-dot" style="background:#C4A1FF;"></span> Lavender
                </button>
                <button class="pause-opt-btn" data-pc="mint"     style="--sw:#6DEABF;">
                    <span class="pause-color-dot" style="background:#6DEABF;"></span> Mint
                </button>
                <button class="pause-opt-btn" data-pc="coral"    style="--sw:#FF7F6B;">
                    <span class="pause-color-dot" style="background:#FF7F6B;"></span> Coral
                </button>
            </div>

            <button id="resumeBtn" class="btn-resume">▶ Resume</button>
        </div>
    </div>

</div>

<script src="game.js"></script>
</body>
</html>
